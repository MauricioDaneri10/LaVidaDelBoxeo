name: Verificar y publicar en GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Confirmar publicación explícita del estado actual de main'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_publish == true
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Auditoría estructural
        run: node audit_engine.js
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Presupuesto de bundle
        run: npm run check:budget
      - name: Verificar referencias del artefacto
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/favicon.svg
          test -d dist/assets
          ! grep -q 'href="/favicon.svg"\|src="/assets/\|href="/assets/' dist/index.html
      - name: Cargar artefacto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_publish == true
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
